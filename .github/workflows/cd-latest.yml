---
name: CD Latest

on:
  push:
    branches:
      - develop

env:
  REGISTRY: ghcr.io

permissions:
  packages: write

jobs:
  CD:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Artefacts
        run: |
          make build
          find azure-servicebus-sink-connector -type f

      - name: Build and Push Image for Multiple Architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          context: .
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
          outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=A Kafka Connect Sink Connecter for Azure Service Bus.
